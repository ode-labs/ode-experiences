<style>

*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

.mono{font-family:var(--mono)}

.tabs{max-width:1560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px 9px;font-size:13px;font-weight:500;color:var(--ink2)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}

/* timeline */

select.gsel{border:1px solid var(--rule2);border-radius:2px;padding:2px 4px;font-size:12px;background:var(--card)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.bar{margin:9px 0}.barhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-bottom:3px}

@media(max-width:760px){.cols{grid-template-columns:1fr}.tl{--gut:112px}.tlab{font-size:10.5px;padding-left:8px}.bname{font-size:9.5px;padding-left:8px}}

<header>
  <div class="hbar"><div><div class="eyebrow">City Loop Planner &middot; 11:00a&ndash;4:00p</div>
  <h1>Raison d&rsquo;&Ecirc;tre <span>&mdash; day planner</span></h1></div>
  <div class="hstats" id="hstats"></div></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="day" aria-selected="true">The day</button>
    <button class="tab" role="tab" data-v="transit" aria-selected="false">Transit</button>
    <button class="tab" role="tab" data-v="risk" aria-selected="false">What if</button>
    <button class="tab" role="tab" data-v="arcs" aria-selected="false">Arcs &amp; targets</button>
    <button class="tab" role="tab" data-v="guests" aria-selected="false">Guests</button>

  </div>
</header>
<div class="wrap"><div id="view"></div></div>
<div id="drawerHost"></div>
<script>
let GUESTS = [];
const SENSES=["Taste","Scent","Touch","Sight","Sound","Space","Time","System"];
const DISCIPLINES=["Architecture and spatial design","Art and creative practice","Culinary arts and gastronomy","Visual and web design","Entrepreneurship and business","Fashion and material culture","Film, photography, and media","Fragrance and beauty","Hospitality","Mathematics and quantitative research","Music and sound","Science and research","Technology and engineering","Writing, publishing, and editorial","Student or emerging practitioner"];
const DIETARY_LABELS=["Vegetarian","Vegan","Gluten-free","Dairy-free","Halal","Kosher","No pork","No fish","No shellfish","Nut allergy","Egg allergy","Soy allergy"];
// Split a comma-joined discipline string safely by matching against the known list,
// so names like "Writing, publishing, and editorial" are never split mid-name.
function parseDiscs(f){
  if(!f)return[];
  const out=[],sorted=DISCIPLINES.slice().sort((a,b)=>b.length-a.length);
  let rem=f;
  while(rem.length){
    const m=sorted.find(d=>rem===d||rem.startsWith(d+','));
    if(m){out.push(m);rem=rem.slice(m.length+(rem.length>m.length?1:0));}
    else{// fallback: take up to next unambiguous comma
      const i=rem.indexOf(',');if(i<0){out.push(rem.trim());break;}
      out.push(rem.slice(0,i).trim());rem=rem.slice(i+1);}
  }
  return out.filter(Boolean);
}
const T0=660, T1=960; // the loop is 11a-4p, full stop
const GUT=190;
const hhmm=m=>{let h=Math.floor(m/60),x=m%60,hh=h%12||12;return hh+(x?':'+String(x).padStart(2,'0'):'')+(h>=12?'p':'a')};
const pt=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());return m?(+m[1])*60+(+m[2]):null};
const ti=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const uid=()=>'s'+Math.random().toString(36).slice(2,8);
const VPALETTE=['#2F62D9','#CC3A44','#0F8A7E','#D9741A','#7A45C4','#3D8A45','#B4157A','#C99A1E',
  '#1F7A9E','#9C4221','#4A5FC1','#1C8C5E','#B33F6B','#5B6472','#8A5A2E','#2C9AA6','#6B3FA0','#A63C2E'];
let _vmap=null;
function venueColor(v){
  if(!_vmap){ _vmap={}; let i=0;
    plan.slots.forEach(s=>{ if(!(s.venue in _vmap)) _vmap[s.venue]=VPALETTE[i++%VPALETTE.length]; });
    plan.joint && plan.joint.forEach(s=>{ if(s.venue&&!(s.venue in _vmap)) _vmap[s.venue]=VPALETTE[i++%VPALETTE.length]; });
  }
  if(!(v in _vmap)) _vmap[v]=VPALETTE[Object.keys(_vmap).length%VPALETTE.length];
  return _vmap[v];
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const DEFAULT_LEG=15;
const DEFAULT_MODES=['walk','train / bus','car'];
const COST_TRAIN=3.00;   // $ per train / bus leg (NYC flat fare)
const COST_CAR_BASE=3.00; // $ base fare per car leg
const COST_CAR_PM=0.30;   // $ per minute for car
const COST_CAR_MILE=1.70; // $ per mile for car (set miles on each leg in Transit tab)
const legKey=(a,b)=>[a,b].sort().join(' \u2194 ');
function leg(a,b){ if(a===b) return {mins:0,mode:'same',known:true};
  const l=(plan.legs||{})[legKey(a,b)];
  return l? {mins:l.mins,mode:l.mode,miles:l.miles||null,known:true} : {mins:DEFAULT_LEG,mode:modes()[0]||'walk',miles:null,known:false}; }
function modes(){ return plan.modes && plan.modes.length ? plan.modes : DEFAULT_MODES; }
function addMode(name){ name=(name||'').trim(); if(!name) return;
  plan.modes = modes().slice(); if(!plan.modes.includes(name)) plan.modes.push(name);
  save(); render(); }
function removeMode(name){
  if(usedLegs().some(l=>l.mode===name)){ alert('Reassign the legs using "'+name+'" before removing it.'); return; }
  plan.modes = modes().filter(m=>m!==name); if(!plan.modes.length) plan.modes=DEFAULT_MODES.slice();
  save(); render(); }
function setLeg(a,b,f,v){ plan.legs=plan.legs||{}; const k=legKey(a,b);
  const cur=plan.legs[k]||{mins:DEFAULT_LEG,mode:'walk'};
  plan.legs[k]={mins:f==='mins'?(parseInt(v)||0):cur.mins, mode:f==='mode'?v:cur.mode, miles:f==='miles'?(parseFloat(v)||null):cur.miles||null};
  save(); render(); }

/* ---------- model: the day is a set of slots, not a set of lanes ---------- */
function defaultPlan(){
  return {slots:[],legs:{},gs:{},itin:{},modes:null};
}
let plan=defaultPlan();
let planLocked=false; // lock mode: paths frozen, only guest-to-path assignment changes
// Planning stages — controls which tools are visible and sets dashboard context
const STAGES=[
  {
    id:'pre-eoi',
    label:'Pre-EOI',
    desc:'Partner planning with synthetic guests',
    context:'You are in the early planning phase. Synthetic guests (SG1–SG60) stand in for real people so you can design and stress-test partner slots, timing, and route coverage before anyone has applied. Adjust the partner schedule, run the solver, and confirm that the program works across a range of 20–30 guests before opening expressions of interest.',
  },
  {
    id:'invited',
    label:'Invited',
    desc:'Selecting and routing EOI applicants',
    context:'Expressions of interest are in. Load the EOI CSV to replace synthetic guests with real applicants, matched to paths by sense fit. Use Select best to shortlist the strongest candidates from the pool, then re-plan to build their routes. You are deciding who gets an invitation and confirming the program can serve them well.',
  },
  {
    id:'paid',
    label:'Paid',
    desc:'Final 25 confirmed — building real itineraries',
    context:'Payment is confirmed. You have your 25 guests. This is the operational phase: lock the paths, verify each guest\'s route, and export the Itineraries JSON for the backend developer to load into each guest\'s private website page.',
  },
];
let planStage='pre-eoi'; // default starting stage
const KEY='raisondetre-day-v4';

// ── Lock helpers ─────────────────────────────────────────────────────────────
// When locked, plan.paths = {pid: [slotId,…]} (unique sequences, immutable)
//              plan.guestPath = {gid: pid}     (the only thing that can change)
// itin(g) in locked mode resolves via guestPath → paths → slotById.

function pathSig(slotIds){
  // Canonical signature for a sequence: slot ids sorted by slot start time
  return slotIds.slice()
    .map(id=>slotById(id)).filter(Boolean)
    .sort((a,b)=>a.start-b.start)
    .map(s=>s.id).join('>');
}

function lockPlan(){
  // 1. Collect every guest's current itin and deduplicate into canonical paths
  const sigMap={}; // sig → pid
  const paths={};  // pid → [slotId,…] sorted by start time
  let counter=0;
  invited().forEach(g=>{
    const ids=(plan.itin[g.id]||[]).filter(id=>slotById(id));
    if(!ids.length)return;
    const sorted=ids.slice().map(id=>slotById(id)).filter(Boolean)
      .sort((a,b)=>a.start-b.start).map(s=>s.id);
    const sig=sorted.join('>');
    if(!sigMap[sig]){counter++;const pid='p'+counter;sigMap[sig]=pid;paths[pid]=sorted;}
  });
  // 2. Assign each invited guest to their path
  const guestPath={};
  invited().forEach(g=>{
    const ids=(plan.itin[g.id]||[]).filter(id=>slotById(id));
    if(!ids.length)return;
    const sorted=ids.slice().map(id=>slotById(id)).filter(Boolean)
      .sort((a,b)=>a.start-b.start).map(s=>s.id);
    const sig=sorted.join('>');
    guestPath[g.id]=sigMap[sig];
  });
  plan.paths=paths;
  plan.guestPath=guestPath;
  planLocked=true;
  save();render();
}

function unlockPlan(){
  // Rebuild itin from guestPath so the solver can re-use it
  if(plan.paths&&plan.guestPath){
    invited().forEach(g=>{
      const pid=plan.guestPath[g.id];
      if(pid&&plan.paths[pid]) plan.itin[g.id]=plan.paths[pid].slice();
    });
  }
  planLocked=false;
  save();render();
}

// Sorted paths list (P1 first)
function pathList(){
  if(!plan.paths)return[];
  return Object.keys(plan.paths).sort((a,b)=>{
    return parseInt(a.slice(1))-parseInt(b.slice(1));
  }).map(pid=>({pid, slots:(plan.paths[pid]||[]).map(id=>slotById(id)).filter(Boolean).sort((a,b)=>a.start-b.start)}));
}

// Guests on a given path
function guestsOnPath(pid){
  if(!plan.guestPath)return[];
  return invited().filter(g=>plan.guestPath[g.id]===pid);
}

// Swap two guests between paths — the only mutation allowed.
// movingGid goes to targetLabel; whoever was on targetLabel comes to movingGid's old path.
function assignGuestToPath(movingGid, targetLabel){
  if(!targetLabel)return;
  if(planLocked){
    if(!plan.paths||!plan.paths[targetLabel])return;
    plan.guestPath=plan.guestPath||{};
    const oldLabel=plan.guestPath[movingGid]; // where moving guest currently is
    // Find the guest(s) currently on targetLabel and move them to oldLabel
    if(oldLabel&&oldLabel!==targetLabel){
      invited().forEach(g=>{
        if(g.id!==movingGid&&plan.guestPath[g.id]===targetLabel){
          plan.guestPath[g.id]=oldLabel;
          plan.itin[g.id]=(plan.paths[oldLabel]||[]).slice();
        }
      });
    }
    plan.guestPath[movingGid]=targetLabel;
    plan.itin[movingGid]=(plan.paths[targetLabel]||[]).slice();
  }else{
    const {labelMap,pathSlots}=livePathMap();
    const targetSlots=pathSlots[targetLabel];
    if(!targetSlots)return;
    const oldLabel=labelMap[movingGid];
    const oldSlots=oldLabel?pathSlots[oldLabel]:null;
    // Swap: any guest on targetLabel gets moved to movingGid's old path
    if(oldSlots&&oldLabel!==targetLabel){
      invited().forEach(g=>{
        if(g.id!==movingGid&&labelMap[g.id]===targetLabel){
          plan.itin[g.id]=oldSlots.slice();
        }
      });
    }
    plan.itin[movingGid]=targetSlots.slice();
  }
  save();render();
}

// Override itin() when locked: resolve via guestPath
const _itinOrig=g=>(plan.itin[g.id]||[]).map(slotById).filter(Boolean).filter(s=>s.status!=='dropped').sort((a,b)=>a.start-b.start);
function itin(g){
  if(planLocked&&plan.guestPath&&plan.paths){
    const pid=plan.guestPath[g.id];
    if(pid&&plan.paths[pid]) return plan.paths[pid].map(id=>slotById(id)).filter(Boolean).filter(s=>s.status!=='dropped');
    return [];
  }
  return _itinOrig(g);
}
async function save(){try{await window.storage.set(KEY,JSON.stringify({plan,guests:GUESTS}))}catch(e){}}
async function load(){try{const r=await window.storage.get(KEY);if(r&&r.value){const d=JSON.parse(r.value);if(d.plan){plan=d.plan;if(Array.isArray(d.guests))GUESTS=d.guests;}else{plan=d;}}}catch(e){}}
function gst(id){return plan.gs[id]||(plan.gs[id]={status:'pool'})}
const invited=()=>GUESTS.filter(g=>gst(g.id).status==='invited');
const interested=()=>GUESTS; // all guests regardless of planning status — used for arc/target analysis
const live=()=>plan.slots.filter(s=>s.status!=='dropped');
const slotById=id=>plan.slots.find(s=>s.id===id);
// itin() is defined above in the lock-helpers block (supports both locked and unlocked modes)
const capOf=s=>s.sizing==='all'?9999:(s.cap||(s.sizing==='capped'?0:9999));
const headcount=s=>invited().filter(g=>(plan.itin[g.id]||[]).includes(s.id)).length;
const W=s=>s.status==='confirmed'?1:.55;
function coverage(g){const m={};itin(g).forEach(s=>(s.senses||[]).forEach(x=>{if(g.s.includes(x))m[x]=Math.max(m[x]||0,W(s))}));return m}
const hitCount=g=>Object.keys(coverage(g)).length;
const idleTime=g=>{let busy=0;itin(g).forEach(s=>busy+=s.end-s.start);return Math.max(0,(T1-T0)-busy-transitMin(g))};
const moves=g=>Math.max(0,itin(g).length-1);
// New CSV format uses pre-parsed accessLabels / dietLabels arrays.
// Legacy synthetic data uses g.d (raw text) — both paths kept for compatibility.
const notReady=g=>(g.regReady||'').trim().toLowerCase()==='no'; // Registration Readiness = No → solver handles last

const accessFlag=g=>g.accessLabels!=null?g.accessLabels.length>0:/cane|wheelchair|fatigue|step-free|elevator|low vision/i.test(g.d||'');
const dietFlag=g=>g.dietLabels!=null?(g.dietLabels.length>0||!!(g.dietNotes&&g.dietNotes.trim())):/vegan|vegetarian|allerg|shellfish|dairy|lactose|nut/i.test(g.d||'');

const isFood=s=>s.food!=null?s.food:(s.isLunch||(s.senses||[]).includes('Taste'));
function guestDietLabels(g){
  if(g.dietLabels) return g.dietLabels; // new CSV format: labels already parsed
  const t=g.d||'';if(!t)return [];const out=[];
  if(/vegetarian/i.test(t))out.push('Vegetarian');
  if(/vegan/i.test(t))out.push('Vegan');
  if(/gluten/i.test(t))out.push('Gluten-free');
  if(/dairy|lactose/i.test(t))out.push('Dairy-free');

// green = confirmed, yellow = unverified (partner hasn't said yes or no), red = hard exclusion

  const gl=guestDietLabels(g);if(!gl.length)return {status:'ok',labels:[]};
  const red=gl.filter(l=>(s.cannotAccommodate||[]).includes(l));
  if(red.length)return {status:'red',labels:red};

// red = wheelchair guest, step-free confirmed No; yellow = wheelchair guest, step-free unknown

const arcKey=g=>SENSES.filter(s=>g.s.includes(s)).join(' · ');

function conflicts(s,list){

  if(s.isLunch && list.some(x=>x.isLunch)) return true;
  return list.some(x=>{
    if(x.id===s.id) return true;
    if(x.venue===s.venue) return true; // no guest visits the same partner twice
    if(s.start<x.end && x.start<s.end) return true;
    const gap = s.start>=x.end ? s.start-x.end : x.start-s.end;
    return gap < leg(x.venue,s.venue).mins;

}
function legsOf(g){const it=itin(g),out=[];
  for(let i=1;i<it.length;i++){const l=leg(it[i-1].venue,it[i].venue);

const transitMin=g=>legsOf(g).reduce((n,x)=>n+x.mins,0);

function legCost(l){

}
const transitCost=g=>+legsOf(g).reduce((n,l)=>n+legCost(l),0).toFixed(2);
const carLegs=g=>legsOf(g).filter(l=>l.mode==='car');
const trainLegs=g=>legsOf(g).filter(l=>l.mode!=='walk'&&l.mode!=='car');
const BUDGET_CAP=50; // max total per guest across all partner stops + transit
const slotCost=(s)=>+(s.cost||0);  // per-guest cost set by organiser for this partner stop
const venueCost=g=>itin(g).reduce((n,s)=>n+slotCost(s),0); // sum of all partner stop costs

const overBudget=g=>totalEventCost(g)>BUDGET_CAP;
function assumedLegs(){const out={};invited().forEach(g=>legsOf(g).forEach(l=>{

function gain(g,s,cov){

  if(s.disciplines&&s.disciplines.length){
    const gDiscs=parseDiscs(g.f);

// gender constraint: slot.gender null/undefined = open to all; 'Woman'/'Man' = restricted
const genderMatch=(g,s)=>!s.gender||s.gender===g.p;

/* ---------- solver ---------- */
// Seeded shuffle: deterministic per seed, randomises within equal-rank groups.
// jitter=0 → pure deterministic; jitter=1 → full random within tier.
let _solverSeed=Date.now()>>>0;
function _rng(){_solverSeed^=_solverSeed<<13;_solverSeed>>>=0;_solverSeed^=_solverSeed>>17;_solverSeed^=_solverSeed<<5;_solverSeed>>>=0;return _solverSeed/4294967296}
function _shuffleWithin(arr,keyFn){
  // stable-sort by key, then Fisher-Yates shuffle within each equal-key run
  arr.sort((a,b)=>keyFn(a)-keyFn(b));
  let i=0;
  while(i<arr.length){
    let j=i;const k=keyFn(arr[i]);
    while(j<arr.length&&keyFn(arr[j])===k)j++;
    for(let x=j-1;x>i;x--){const r=i+Math.floor(_rng()*(x-i+1));[arr[x],arr[r]]=[arr[r],arr[x]];}
    i=j;
  }

}
function tionti(guestList){
  // Accept an explicit guest list (e.g. paid-only) or fall back to whoever is planning-invited
  const gs=guestList||invited();
  plan.itin={}; const load={};
  live().forEach(s=>load[s.id]=0);
  // initialise every guest's itinerary array
  gs.forEach(g=>{plan.itin[g.id]=[]});
  // everyone-slots are non-negotiable and uncapped
  const all=live().filter(s=>s.sizing==='all');
  gs.forEach(g=>{plan.itin[g.id]=all.map(s=>s.id)});

  // ── PHASE 1: hard-capped slots are confirmed reservations ──────────────────
  // Fill them slot-first, completely, before any other assignment runs.
  // Sorted tightest cap first so the hardest-to-fill reservations get first pick.
  live().filter(s=>s.sizing==='capped')
    .sort((a,b)=>capOf(a)-capOf(b))
    .forEach(s=>{
      const eligible=gs.filter(g=>
        !(plan.itin[g.id]||[]).includes(s.id)&&
        !conflicts(s,itin(g))&&
        genderMatch(g,s)
      );
      // Shuffle within each classification tier so groupings vary each run
      _shuffleWithin(eligible, g=>clsRank(g)*2+(notReady(g)?1:0));
      // Within each shuffled tier, still prefer higher sense gain
      eligible.sort((a,b)=>{
        const base=clsRank(a)*2+(notReady(a)?1:0)-(clsRank(b)*2+(notReady(b)?1:0));if(base)return base;
        const ag=gain(a,s,coverage(a)),bg=gain(b,s,coverage(b));
        return ag!==bg ? bg-ag : 0; // tie on gain → keep shuffled order
      });
      for(const g of eligible){
        if(load[s.id]>=capOf(s))break;
        plan.itin[g.id].push(s.id);load[s.id]++;
      }
    });

  // ── PHASE 2: greedy sense-coverage pass for flex/remaining slots ───────────
  // Sort order: classification tier → notReady → arc difficulty (hardest first within tier).
  // Priority + Hash Table guests are non-negotiable and run before Partner Network and General.
  const reach=g=>g.s.filter(x=>live().some(s=>(s.senses||[]).includes(x))).length/g.s.length;
  const order=_shuffleWithin(gs.slice(), g=>clsRank(g)*2+(notReady(g)?1:0));
  order.sort((a,b)=>{
    const base=clsRank(a)*2+(notReady(a)?1:0)-(clsRank(b)*2+(notReady(b)?1:0));if(base)return base;
    return reach(a)-reach(b); // hardest arc first within tier, then shuffled order preserved
  });

    for(let k=0;k<5;k++){
      const cur=itin(g), cov=coverage(g);
      let best=null,bv=0;
      live().forEach(s=>{
        if(s.sizing==='all')return;
        if(load[s.id]>=capOf(s))return;
        if(conflicts(s,cur))return;
        if(!genderMatch(g,s))return;
        const near=cur.length?Math.min(...cur.map(x=>leg(x.venue,s.venue).mins)):0;

        const v=gain(g,s,cov) - 0.02 - 0.006*near - 0.015*legCost(nearLeg) - (accessFlag(g)?0.06:0);
        if(v>bv){bv=v;best=s}

      if(!best)break;
      plan.itin[g.id].push(best.id);load[best.id]++;

  const capFill=()=>{
    live().filter(s=>s.sizing==='capped'&&load[s.id]<capOf(s))
      .sort((a,b)=>load[a.id]/Math.max(1,capOf(a))-load[b.id]/Math.max(1,capOf(b)))
      .forEach(s=>{
        const eligible=gs.filter(g=>!(plan.itin[g.id]||[]).includes(s.id)&&!conflicts(s,itin(g))&&genderMatch(g,s));
        eligible.sort((a,b)=>{
          const base=guestSortKey(a,b);if(base)return base;
          return idleTime(b)-idleTime(a);
        });

      });

  // classification tier → notReady determines fill order
  const fillOrder=gs.slice().sort(guestSortKey);
  fillOrder.forEach(g=>{
    live().forEach(s=>{
      if(s.sizing==='all'||load[s.id]>=capOf(s))return;
      if(conflicts(s,itin(g)))return;
      if(!genderMatch(g,s))return;
      if(gain(g,s,coverage(g))>0||idleTime(g)>90){plan.itin[g.id].push(s.id);load[s.id]++}
    });

}
function localSearch(load,iters){
  const gs=invited();if(!gs.length)return;
  let cur=objective();
  for(let i=0;i<iters;i++){

    const mine=plan.itin[g.id]||[];
    const drop=Math.random()<.5&&mine.length>1;
    const before=mine.slice();
    if(drop){const j=Math.floor(Math.random()*mine.length);const s=slotById(mine[j]);
      if(!s||s.sizing==='all')continue; mine.splice(j,1); load[s.id]--;}
    const pool=live().filter(s=>s.sizing!=='all'&&load[s.id]<capOf(s)&&!mine.includes(s.id)&&!conflicts(s,itin(g))&&genderMatch(g,s));
    if(pool.length){const s=pool[Math.floor(Math.random()*pool.length)];mine.push(s.id);load[s.id]++}
    const now=objective();
    if(now<cur-1e-9){ // revert
      mine.forEach(id=>{if(!before.includes(id))load[id]--});
      before.forEach(id=>{if(!mine.includes(id))load[id]++});

function seedSample(n){

function selectTop(n){

  // Priority (0) and Hash Table (1) guests are non-negotiable — always included first

// Compute a live sig→pathLabel map from current itins (works pre- and post-lock)
function livePathMap(){
  const sigMap={},labelMap={};let counter=0;
  // Use invited() sorted by guest id for stable numbering
  invited().slice().sort((a,b)=>a.id.localeCompare(b.id)).forEach(g=>{
    const ids=(plan.itin[g.id]||[]).map(id=>slotById(id)).filter(Boolean)
      .filter(s=>s.status!=='dropped').sort((a,b)=>a.start-b.start).map(s=>s.id);
    if(!ids.length)return;
    const sig=ids.join('>');
    if(!sigMap[sig]){counter++;sigMap[sig]='P'+counter;}
    labelMap[g.id]=sigMap[sig];
  });
  // Reverse: pathLabel → sorted slot ids
  const pathSlots={};
  Object.entries(sigMap).forEach(([sig,label])=>{pathSlots[label]=sig.split('>')});
  return {labelMap,pathSlots};
}

    let h=`<div class="idle" style="left:0;right:0"></div>`;
    legsOf(g).forEach(l=>{const a=l.from.end,b=Math.min(l.to.start,a+l.mins);
      h+=`<div class="leg${l.known?'':' guess'}" title="${esc(l.from.venue)} → ${esc(l.to.venue)}: ${l.mins} min ${l.mode}${l.known?'':' (assumed)'}" style="left:${X(a)}%;width:${X(b)-X(a)}%">${l.mode[0].toUpperCase()}</div>`});
    it.forEach(s=>{
      h+=`<div class="seg" title="${esc(s.venue)} ${hhmm(s.start)}–${hhmm(s.end)}" style="left:${X(s.start)}%;width:calc(${X(s.end)-X(s.start)}% - 2px);background:${venueColor(s.venue)}">${esc(s.venue.slice(0,2).toUpperCase())}</div>`});
    // Name label: "P3 · SG12" on one line
    const nameHtml=pathLabel
      ?`<span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink3)">${pathLabel}</span> <span style="font-size:11px">${esc(g.n)}</span>`
      :`<span style="font-size:11px">${esc(g.n)}</span>`;
    out.push(`<div class="brow"><div class="bname">${nameHtml}</div><div class="ttrack">${h}</div></div>`);
  });
  return out.join('');
}

/* ---------- path braid (locked mode) ---------- */
function pathBraidRows(){
  const paths=pathList();
  if(!paths.length)return '<p class="note" style="padding:10px 0">No paths. Lock the plan after running the solver.</p>';
  const allPids=paths.map(p=>p.pid);

  // Render each path as a timeline row + guest chips below it
  const rowHeight=34, chipAreaHeight=38;
  const totalH=(rowHeight+chipAreaHeight)*paths.length;

  // Build the braid
  let braids='';
  paths.forEach(({pid,slots})=>{
    // timeline row
    let h=`<div class="idle" style="left:0;right:0"></div>`;
    // transit legs between stops on this path
    for(let i=1;i<slots.length;i++){
      const l=leg(slots[i-1].venue,slots[i].venue);
      const a=slots[i-1].end, b=Math.min(slots[i].start,a+l.mins);
      if(b>a) h+=`<div class="leg${l.known?'':' guess'}" title="${esc(slots[i-1].venue)} → ${esc(slots[i].venue)}: ${l.mins}m ${l.mode}" style="left:${X(a)}%;width:${X(b)-X(a)}%">${l.mode[0].toUpperCase()}</div>`;
    }
    slots.forEach(s=>{
      h+=`<div class="seg" title="${esc(s.venue)} ${hhmm(s.start)}–${hhmm(s.end)}" style="left:${X(s.start)}%;width:calc(${X(s.end)-X(s.start)}% - 2px);background:${venueColor(s.venue)}">${esc(s.venue.slice(0,2).toUpperCase())}</div>`;
    });
    // guest chips with reassign dropdown
    const gs=guestsOnPath(pid);
    const chips=gs.map(g=>{
      const otherPids=allPids.filter(p=>p!==pid);
      const opts=otherPids.map(p=>`<option value="${p}">${p.toUpperCase()}</option>`).join('');
      return `<span style="display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--rule);border-radius:2px;padding:2px 4px 2px 7px;font-size:11px;white-space:nowrap;margin:2px">
        <span style="font-weight:500">${esc(g.n)}</span>
        <select title="Move ${esc(g.n)} to a different path" style="border:0;background:transparent;font-family:var(--mono);font-size:10px;color:var(--ink2);cursor:pointer;padding:0 2px" onchange="assignGuestToPath('${g.id}',this.value);this.selectedIndex=0">
          <option value="">move to…</option>${opts}
        </select>
      </span>`;
    }).join('');

    braids+=`<div style="border-bottom:1px solid var(--rule2);padding-bottom:4px;margin-bottom:2px">
      <div class="brow" style="height:${rowHeight}px">
        <div class="bname" style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink)">${pid.toUpperCase()} <span style="font-weight:400;color:var(--ink3)">${gs.length} guest${gs.length===1?'':'s'}</span></div>
        <div class="ttrack">${h}</div>
      </div>
      <div style="padding-left:var(--gut);min-height:28px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding-bottom:6px">${chips||'<span class="gsub" style="font-size:11px;padding-left:2px">no guests assigned</span>'}</div>
    </div>`;
  });

  // Guests with no path assigned yet
  const unassigned=invited().filter(g=>!plan.guestPath||!plan.guestPath[g.id]);
  const unassignedSection=unassigned.length?`<div style="margin-top:16px">
    <div class="eyebrow" style="color:#b85c00;margin-bottom:6px">Unassigned guests (${unassigned.length})</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px">${unassigned.map(g=>{
      const opts=allPids.map(p=>`<option value="${p}">${p.toUpperCase()}</option>`).join('');
      return `<span style="display:inline-flex;align-items:center;gap:3px;background:#fff5eb;border:1px solid #f0c070;border-radius:2px;padding:2px 4px 2px 7px;font-size:11px;white-space:nowrap">
        <span style="font-weight:500">${esc(g.n)}</span>
        <select title="Assign ${esc(g.n)} to a path" style="border:0;background:transparent;font-family:var(--mono);font-size:10px;color:#b85c00;cursor:pointer;padding:0 2px" onchange="assignGuestToPath('${g.id}',this.value);this.selectedIndex=0">
          <option value="">assign to…</option>${opts}
        </select>
      </span>`;
    }).join('')}</div>
  </div>`:'';

  return `<div class="scroller"><div class="tl" style="padding:8px 0;--gut:120px">
    <div class="axis">${axis()}</div>${ticks()}
    <div style="position:relative">${braids}</div>
  </div></div>${unassignedSection}`;
}

}
function numIn(val,cb,title){

      tb('Select',numField+'<button class="btn" title="Score all applicants by sense fit, registration readiness, and classification tier. Select the best N and invite them." onclick="selectTop(inviteTarget)">Select best</button><button class="btn" title="Re-run the solver for the current invited guest list" onclick="tionti()">Re-plan</button>');
  }
  if(planStage==='paid'){
    const paidN=GUESTS.filter(g=>g.st==='paid').length;
    return tb('Final 25','<button class="btn solid" title="Switch to only guests who have paid. These are your confirmed 25." onclick="sampleAllPaid();tionti()">All paid guests</button><button class="btn" title="Re-run the solver for confirmed paid guests" onclick="tionti()">Re-plan</button><span style="font-size:11px;color:var(--ink3)">'+paidN+' confirmed</span>')+
      tb('Lock paths','<button class="btn" style="border-color:#1F7A4D;color:#1F7A4D" title="Freeze all route sequences as named paths (P1, P2...). Slot editing and the solver are disabled. The only remaining action is moving guests between paths, then exporting." onclick="if(confirm(\'Lock the paths? Slot editing and solver will be disabled. You can only move guests between paths.\')){lockPlan();render()}">Lock &amp; assign</button>');
  }
  return '';

function newSolverSeed(){_solverSeed=Date.now()>>>0;}

/* ---------- transit ---------- */
function viewTransit(){
  const used=usedLegs(), assumed=used.filter(l=>!l.known), tight=used.filter(l=>l.tight);
  const inv=invited();
  const worst=inv.slice().sort((a,b)=>transitMin(b)-transitMin(a)).slice(0,8);
  // cost helpers for display
  const fmt$=n=>n===0?'$0':'$'+n.toFixed(2);
  function legCostLabel(l){
    if(l.mode==='walk') return '<span style="color:#1a6b2a;font-family:var(--mono);font-size:10px">free</span>';
    if(l.mode==='car')  return `<span style="color:#b85c00;font-family:var(--mono);font-size:10px">${fmt$(legCost(l))}</span>`;
    return `<span style="font-family:var(--mono);font-size:10px">${fmt$(legCost(l))}</span>`;
  }
  const row=l=>`<tr><td><b>${esc(l.a)}</b> <span class="gsub">to</span> <b>${esc(l.b)}</b>
      <div class="gsub">${l.n} guest${l.n===1?'':'s'} make this move${l.known?'':' · assumed, not measured'}${l.tight?' · '+l.tight+' too tight to make':''}</div></td>
    <td><input class="legin" value="${l.mins}" onchange="setLeg('${esc(l.a)}','${esc(l.b)}','mins',this.value)"> <span class="gsub">min</span>
      <select class="gsel" style="margin-left:4px" onchange="setLeg('${esc(l.a)}','${esc(l.b)}','mode',this.value)">
        ${modes().map(m=>`<option value="${esc(m)}"${l.mode===m?' selected':''}>${esc(m)}</option>`).join('')}
        ${modes().includes(l.mode)?'':`<option value="${esc(l.mode)}" selected>${esc(l.mode)} (custom)</option>`}
      </select>${l.mode==='car'?` <input class="legin" style="width:38px;margin-left:4px" value="${l.miles||''}" placeholder="mi" title="Distance in miles — used for per-mile cost" onchange="setLeg('${esc(l.a)}','${esc(l.b)}','miles',this.value)"> <span class="gsub">mi</span>`:''} ${legCostLabel(l)}</td></tr>`;
  // cost equity data
  const byCost=inv.slice().map(g=>({g,cost:transitCost(g),carMin:carLegs(g).reduce((n,l)=>n+l.mins,0),trainN:trainLegs(g).length}))
    .sort((a,b)=>b.cost-a.cost);
  const costs=byCost.map(x=>x.cost);
  const minC=costs.length?Math.min(...costs):0, maxC=costs.length?Math.max(...costs):0;
  const medC=costs.length?costs.slice().sort((a,b)=>a-b)[Math.floor(costs.length/2)]:0;
  const hasCarGuests=byCost.filter(x=>x.carMin>0).length;
  return `<div class="toolbar"><button class="btn solid" onclick="tionti()">Re-plan with these times</button></div>
  <p class="note" style="margin-bottom:14px">Nothing here is precalculated — every leg is a number and a mode you set. Unset pairs run on a ${DEFAULT_LEG}-minute placeholder so nothing silently breaks. The loop runs 11a&ndash;4p and nothing can sit outside it, so the solver stops proposing itineraries that can't physically be made in the time between two stops. Dotted legs on the braid are ones it had to assume.</p>
  <p class="note" style="margin-bottom:14px">Cost model: walk = free · train&thinsp;/&thinsp;bus = $${COST_TRAIN.toFixed(2)} per ticket · car = $${COST_CAR_BASE.toFixed(2)} base + $${COST_CAR_PM.toFixed(2)}&thinsp;/&thinsp;min + $${COST_CAR_MILE.toFixed(2)}&thinsp;/&thinsp;mi (set miles on each car leg below). The solver favours walking first, then transit, then car when building itineraries.</p>
  <div class="panel" style="margin-bottom:16px"><h2>Transit modes</h2>
    <p class="note">Add whatever your city loop actually uses — bike, ferry, shuttle van, golf cart, anything.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
      ${modes().map(m=>`<span class="btn sm" style="display:inline-flex;align-items:center;gap:6px">${esc(m)} <button onclick="removeMode('${esc(m)}')" title="Remove" style="border:0;background:none;padding:0;color:var(--ink3);font-family:var(--mono)">×</button></span>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <input id="newMode" placeholder="e.g. bike" style="padding:6px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--card);width:160px" onkeydown="if(event.key==='Enter'){addMode(this.value);this.value=''}">
      <button class="btn sm" onclick="const i=document.getElementById('newMode');addMode(i.value);i.value=''">Add mode</button>
    </div></div>
  <div class="cols"><div>
    <div class="panel"><h2>Moves your plan actually makes</h2>
      <p class="note">Only the pairs someone is currently routed between. Add a new partner and re-plan to see their legs here.</p>
      <table class="ledger" style="margin-top:10px">${used.map(row).join('')||'<tr><td class="note">No one moves between venues yet.</td></tr>'}</table></div>
    ${(()=>{
      // All possible venue pairs from live slots — lets you set travel times for new
      // partners (e.g. tentative) before anyone is routed through them.
      const venues=[...new Set(live().map(s=>s.venue))];
      const allPairs=[];
      for(let i=0;i<venues.length;i++) for(let j=i+1;j<venues.length;j++) allPairs.push([venues[i],venues[j]]);
      const usedKeys=new Set(used.map(l=>legKey(l.a,l.b)));
      const unset=allPairs.filter(([a,b])=>!usedKeys.has(legKey(a,b)));
      if(!unset.length)return '';
      return `<div class="panel" style="padding:0">
        <div style="padding:11px 13px;display:flex;justify-content:space-between;align-items:center">
          <span><b>Venue pairs not yet in any itinerary</b> <span class="gsub" style="margin-left:6px">${unset.length} pair${unset.length===1?'':'s'} — set times before re-planning</span></span>
          <button class="btn sm" onclick="unsetPairsOpen=!unsetPairsOpen;document.getElementById('unset-pairs').style.display=unsetPairsOpen?'block':'none';this.textContent=unsetPairsOpen?'▴ collapse':'▸ expand'">${unsetPairsOpen?'▴ collapse':'▸ expand'}</button>
        </div>
        <div id="unset-pairs" style="display:${unsetPairsOpen?'block':'none'};padding:0 13px 13px">
          <p class="note" style="margin-bottom:8px">These venue pairs exist in your plan but nobody is currently routed between them — either because the slot is new, tentative, or the solver hasn't placed anyone there yet. Set travel times here so re-planning uses real numbers from the start.</p>
          <table class="ledger">${unset.map(([a,b])=>{const l=leg(a,b);return `<tr><td><b>${esc(a)}</b> <span class="gsub">↔</span> <b>${esc(b)}</b></td>
            <td><input class="legin" value="${l.mins}" onchange="setLeg('${esc(a)}','${esc(b)}','mins',this.value)"> <span class="gsub">min</span>
              <select class="gsel" style="margin-left:4px" onchange="setLeg('${esc(a)}','${esc(b)}','mode',this.value)">
                ${modes().map(m=>`<option value="${esc(m)}"${l.mode===m?' selected':''}>${esc(m)}</option>`).join('')}
              </select></td></tr>`}).join('')}</table>
        </div>
      </div>`;
    })()}

/* ---------- what if ---------- */
function whatIf(s){ // hold assignments fixed, remove this slot
  const inv=invited(); let lost=0, zero=0, senses={};
  inv.forEach(g=>{
    const ids=(plan.itin[g.id]||[]);
    if(!ids.includes(s.id))return;
    const before=Object.keys(coverage(g));
    const kept=itin(g).filter(x=>x.id!==s.id);
    const m={};kept.forEach(x=>(x.senses||[]).forEach(y=>{if(g.s.includes(y))m[y]=1}));
    const after=Object.keys(m);
    const gone=before.filter(x=>!after.includes(x));
    gone.forEach(x=>senses[x]=(senses[x]||0)+1);
    lost+=gone.length;
    if(before.length&&!after.length)zero++;
  });
  return {n:headcount(s),lost,zero,senses};
}
function viewRisk(){
  const tent=plan.slots.filter(s=>s.status!=='confirmed');
  const rows=tent.map(s=>({s,w:whatIf(s)})).sort((a,b)=>(b.w.zero*4+b.w.lost)-(a.w.zero*4+a.w.lost));
  const conf=plan.slots.filter(s=>s.status==='confirmed');
  return `<div class="toolbar"><button class="btn solid" onclick="tionti()">Re-plan with current statuses</button></div>
  <div class="cols"><div>
    <div class="panel"><h2>If this partner falls through</h2>
      <p class="note">Assuming you don't re-plan. The number is how many senses guests lose outright — not how many people are in the room. Flip a status and the whole day recalculates; hit re-plan to let the solver route around it.</p>
      <table class="ledger" style="margin-top:10px">${rows.map(({s,w})=>`<tr>
        <td><b>${esc(s.venue)}</b> <span class="gsub">${hhmm(s.start)}–${hhmm(s.end)} · ${s.sizing==='capped'?'max '+s.cap:s.sizing}</span>
          <div style="margin-top:3px">${Object.keys(w.senses).map(x=>`<span style="color:var(--${x})">■</span> ${x} ×${w.senses[x]}`).join('&nbsp;&nbsp;')||'<span class="gsub">nothing lost — everyone gets these senses elsewhere</span>'}</div></td>
        <td>−${w.lost}${w.zero?`<div class="gsub">${w.zero} to zero</div>`:''}
          <div style="margin-top:4px"><select class="gsel" onchange="setStatus2('${s.id}',this.value)">
            <option value="tentative"${s.status==='tentative'?' selected':''}>tentative</option>
            <option value="confirmed"${s.status==='confirmed'?' selected':''}>confirmed</option>
            <option value="dropped"${s.status==='dropped'?' selected':''}>dropped</option></select></div></td></tr>`).join('')||'<tr><td class="note">Everything is confirmed.</td></tr>'}</table></div>
  </div><div>
    <div class="panel"><h2>Load against capacity</h2>
      <table class="ledger">${live().map(s=>{const n=headcount(s),c=capOf(s);
        return `<tr><td>${esc(s.venue)} <span class="gsub">${hhmm(s.start)}</span></td><td>${n}${c<9999?(s.sizing==='flex'?' / ~'+c:' / '+c):' · flex'}${n>c?' ⚠':''}</td></tr>`}).join('')}</table>
      <p class="note">A capped stop that runs hot is the signal to ask for a second sitting rather than a bigger room — two sittings is usually the easier yes, and it splits the group in a way the braid can absorb.</p></div>
    <div class="panel"><h2>Locked in</h2>
      <table class="ledger">${conf.map(s=>`<tr><td>${esc(s.venue)}</td><td>${hhmm(s.start)}–${hhmm(s.end)}</td></tr>`).join('')}</table></div>
  </div></div>`;

/* ---------- arcs & targets ---------- */
function openWindows(){ // sweep the clock for stretches when a real share of the room is free
  const inv=interested(); if(!inv.length) return [];
  const need=Math.max(3,Math.round(inv.length*0.25)), step=5, out=[];
  const busy=(g,m)=>itin(g).some(s=>s.start<=m&&s.end>m);
  let run=null;
  for(let m=T0;m<T1;m+=step){
    const free=inv.filter(g=>!busy(g,m));
    if(free.length>=need){
      const ids=new Set(free.map(g=>g.id));
      if(!run) run={a:m,b:m+step,set:ids};
      else {run.b=m+step; run.set=new Set([...run.set].filter(x=>ids.has(x)));}
      if(run.set.size<need){ if(run.b-step-run.a>=25) out.push({a:run.a,b:run.b-step,set:run.set}); run=null; }
    } else { if(run&&run.b-run.a>=25) out.push(run); run=null; }
  }
  if(run&&run.b-run.a>=25) out.push(run);
  return out.map(r=>({a:r.a,b:r.b,free:inv.filter(g=>r.set.has(g.id))})).filter(r=>r.free.length>=3);
}
function bookingTargets(){
  const out=[],inv=interested();
  openWindows().forEach(w=>{
    SENSES.forEach(x=>{
      const gain=w.free.filter(g=>g.s.includes(x)&&!coverage(g)[x]);
      const zero=gain.filter(g=>hitCount(g)===0).length;
      // tentative slots that already cover this sense in this window
      const tentVenues=[...new Set(live().filter(s=>s.status==='tentative'&&(s.senses||[]).includes(x)&&s.start<w.b&&s.end>w.a).map(s=>s.venue))];
      if(gain.length)out.push({a:w.a,b:w.b,sense:x,gain:gain.length,free:w.free.length,zero,tentVenues});
    });
  });
  // an everyone-slot lifts the whole room at once
  SENSES.forEach(x=>{
    const gain=inv.filter(g=>g.s.includes(x)&&!coverage(g)[x]);
    const tentVenues=[...new Set(live().filter(s=>s.status==='tentative'&&(s.senses||[]).includes(x)).map(s=>s.venue))];
    if(gain.length)out.push({all:true,sense:x,gain:gain.length,free:inv.length,zero:gain.filter(g=>hitCount(g)===0).length,tentVenues});
  });
  return out.sort((p,q)=>(q.zero*3+q.gain)-(p.zero*3+p.gain));
}
function arcTable(){
  const m={};interested().forEach(g=>{const k=arcKey(g);(m[k]=m[k]||{k,senses:g.s.slice(),n:0,people:[]});m[k].n++;m[k].people.push(g)});
  return Object.values(m).map(a=>{
    const got={};a.people.forEach(g=>Object.keys(coverage(g)).forEach(x=>got[x]=(got[x]||0)+1));
    // nowhere = no live slot covers this sense at all
    const nowhere=a.senses.filter(x=>!live().some(s=>(s.senses||[]).includes(x)));
    // tentative-only = covered by at least one tentative slot but no confirmed slot
    const tentOnly=a.senses.filter(x=>!nowhere.includes(x)&&live().some(s=>s.status==='tentative'&&(s.senses||[]).includes(x))&&!live().some(s=>s.status==='confirmed'&&(s.senses||[]).includes(x)));
    // thin = covered somewhere confirmed, but not everyone with this arc can reach it (capacity)
    const missed=a.senses.filter(x=>!nowhere.includes(x)&&!tentOnly.includes(x)&&(got[x]||0)<a.n);
    const avg=a.people.reduce((n,g)=>n+hitCount(g)/g.s.length,0)/a.n;
    return {...a,nowhere,tentOnly,missed,avg};
  }).sort((x,y)=>(y.nowhere.length*y.n)-(x.nowhere.length*x.n)||x.avg-y.avg);
}
// ranked list of tentative slots by how many guests' arcs they'd unlock if confirmed
function confirmPriority(){
  const inv=interested();
  return live().filter(s=>s.status==='tentative').map(s=>{
    const unlocks=inv.filter(g=>g.s.some(x=>(s.senses||[]).includes(x)&&!live().filter(t=>t.status==='confirmed').some(t=>(t.senses||[]).includes(x)))).length;
    const seatsLeft=Math.max(0,capOf(s)-headcount(s));
    return {...s,unlocks,seatsLeft};
  }).filter(s=>s.unlocks>0).sort((a,b)=>b.unlocks-a.unlocks);
}
// dominant unmet sense in a window (for open-windows table)
function dominantSense(w){
  let best=null,bv=0;
  SENSES.forEach(x=>{const n=w.free.filter(g=>g.s.includes(x)&&!coverage(g)[x]).length;if(n>bv){bv=n;best=x}});
  return best?{sense:best,n:bv}:null;
}
function senseGaps(){
  // For each sense: recruit (no live slot), confirm (tentative only), thin (confirmed but capacity short)
  const inv=interested();
  return SENSES.map(x=>{
    const needs=inv.filter(g=>g.s.includes(x));
    if(!needs.length) return null;
    const hasLive=live().some(s=>(s.senses||[]).includes(x));
    const hasConfirmed=live().some(s=>s.status==='confirmed'&&(s.senses||[]).includes(x));
    const tentSlots=live().filter(s=>s.status==='tentative'&&(s.senses||[]).includes(x));
    const covered=inv.filter(g=>coverage(g)[x]);
    const uncovered=needs.filter(g=>!coverage(g)[x]);
    // thin: confirmed slot exists but not all who need it are covered (capacity pressure)
    const thin=hasConfirmed&&uncovered.length>0;
    // who are the affected guests (arcs that include this sense, as short labels)
    const arcLabels=[...new Set(needs.map(g=>g.s.join('+').replace(/[A-Z]/g,m=>' '+m).trim()))].slice(0,4);
    if(!hasLive) return {sense:x,tier:'recruit',needs:needs.length,uncovered:uncovered.length,tentSlots:[],thin:false,arcLabels};
    if(!hasConfirmed) return {sense:x,tier:'confirm',needs:needs.length,uncovered:uncovered.length,tentSlots,thin:false,arcLabels};
    if(thin) return {sense:x,tier:'thin',needs:needs.length,uncovered:uncovered.length,tentSlots:[],thin:true,arcLabels};
    return null;
  }).filter(Boolean).sort((a,b)=>{
    const rank={recruit:0,confirm:1,thin:2};
    return rank[a.tier]-rank[b.tier]||b.uncovered-a.uncovered;
  });
}
function viewArcs(){
  if(!interested().length)return `<div class="panel"><h2>No guests loaded</h2><p class="note">Load a plan or generate guest data first.</p></div>`;
  const inv=interested(),gaps=senseGaps(),cp=confirmPriority(),wins=openWindows();

  // Build a single unified action list, ordered by impact (guests affected)
  // Each item: {priority, label, sub, action, actionLabel, actionStyle, badge, badgeStyle}
  const actions=[];

  // 1. Senses with zero live coverage — highest urgency
  gaps.filter(g=>g.tier==='recruit').forEach(g=>{
    // Best window from openWindows for this sense
    const bestWin=wins.reduce((best,w)=>{
      const n=w.free.filter(gx=>gx.s.includes(g.sense)&&!coverage(gx)[g.sense]).length;
      return n>(best?.n||0)?{w,n}:best;
    },null);
    const winHint=bestWin?` · best window ${hhmm(bestWin.w.a)}–${hhmm(bestWin.w.b)}`:'';
    actions.push({
      priority:g.uncovered*3,
      badge:'Recruit',badgeStyle:'background:#c0392b;color:#fff',
      sense:g.sense,
      label:`${g.uncovered} guests need ${g.sense} — no partner on the board`,
      sub:`Find a partner covering ${g.sense}${winHint} · ~${g.uncovered} seats`,
      action:`tab='day';render();openFitSlot()`,
      actionLabel:'Find best window',actionStyle:'solid'
    });
  });

  // 2. Tentative slots that would unlock the most guests if confirmed
  cp.forEach(s=>{
    actions.push({
      priority:s.unlocks*2,
      badge:'Confirm',badgeStyle:'background:#b85c00;color:#fff',
      sense:null,
      label:`Confirm ${esc(s.venue)} — unlocks ${s.unlocks} guests`,
      sub:`${hhmm(s.start)}–${hhmm(s.end)} · ${(s.senses||[]).map(x=>`<span style="color:var(--${x})">■</span> ${x}`).join(' ')} · ${s.seatsLeft} seats left`,
      action:`editSlot('${s.id}')`,
      actionLabel:'Open slot',actionStyle:''
    });
  });

  // 3. Capacity bottlenecks — confirmed slot exists but can't fit everyone
  gaps.filter(g=>g.tier==='thin').forEach(g=>{
    // find the confirmed slot(s) covering this sense
    const confSlots=live().filter(s=>s.status==='confirmed'&&(s.senses||[]).includes(g.sense));
    const venues=confSlots.map(s=>esc(s.venue)).join(', ');
    actions.push({
      priority:g.uncovered,
      badge:'Capacity',badgeStyle:'background:#555;color:#fff',
      sense:g.sense,
      label:`${g.uncovered} guests can't reach ${g.sense} — ${venues} is full`,
      sub:`Ask for a second sitting · +${g.uncovered} seats needed`,
      action:`editSlot('${confSlots[0]?.id}')`,
      actionLabel:'Open slot',actionStyle:''
    });
  });

  // Sort by impact
  actions.sort((a,b)=>b.priority-a.priority);

  const coveragePct=Math.round(inv.filter(g=>hitCount(g)===g.s.length).length/inv.length*100);
  const zeroPct=inv.filter(g=>hitCount(g)===0).length;
  const avgCov=Math.round(inv.reduce((n,g)=>n+hitCount(g)/g.s.length,0)/inv.length*100);

  return `
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">
    <div class="panel" style="flex:1;min-width:140px;padding:14px 18px">
      <div class="eyebrow">Arc coverage</div>
      <div style="font-size:26px;font-weight:600;font-family:var(--mono);margin-top:4px">${avgCov}%</div>
      <div class="gsub">avg across all ${inv.length} interested</div>
    </div>
    <div class="panel" style="flex:1;min-width:140px;padding:14px 18px">
      <div class="eyebrow">Full arc hit</div>
      <div style="font-size:26px;font-weight:600;font-family:var(--mono);margin-top:4px">${coveragePct}%</div>
      <div class="gsub">guests with every sense covered</div>
    </div>
    <div class="panel" style="flex:1;min-width:140px;padding:14px 18px">
      <div class="eyebrow">Nothing scheduled</div>
      <div style="font-size:26px;font-weight:600;font-family:var(--mono);margin-top:4px">${zeroPct}</div>
      <div class="gsub">guests with zero individual slots</div>
    </div>
    <div class="panel" style="flex:1;min-width:140px;padding:14px 18px">
      <div class="eyebrow">Open windows</div>
      <div style="font-size:26px;font-weight:600;font-family:var(--mono);margin-top:4px">${wins.length}</div>
      <div class="gsub">time blocks where guests are free</div>
    </div>
  </div>
  ${actions.length?`
  <div class="panel">
    <h2>What to fix, in order</h2>
    <p class="note" style="margin-bottom:12px">Sorted by how many guests each action would improve. Fix the top item, re-plan, then come back.</p>
    <table class="ledger">
    ${actions.map((a,i)=>`<tr style="${i===0?'background:#fafaf7':''}">
      <td style="width:80px;vertical-align:top;padding-top:9px">
        <span style="display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:2px;${a.badgeStyle}">${a.badge}</span>
      </td>
      <td>
        <div style="font-weight:600;font-size:13px;margin-bottom:2px">
          ${a.sense?`<span style="color:var(--${a.sense})">■</span> `:''}${a.label}
        </div>
        <div class="gsub">${a.sub}</div>
      </td>
      <td style="text-align:right;white-space:nowrap;vertical-align:top;padding-top:7px">
        <button class="btn sm${a.actionStyle==='solid'?' solid':''}" onclick="${a.action};render()">${a.actionLabel}</button>
      </td></tr>`).join('')}
    </table>
  </div>`:`<div class="panel"><p class="note" style="padding:6px 0">Every sense in every arc is covered and all slots have room. Nothing to fix right now — re-plan to refresh.</p></div>`}
  ${wins.length?`<div class="panel" style="margin-top:12px">
    <h2>Free windows on the clock</h2>
    <p class="note" style="margin-bottom:8px">These are the hours where a meaningful share of guests are unscheduled. The best new slot goes here.</p>
    <table class="ledger">${wins.map(w=>{
      const d=dominantSense(w);
      return `<tr><td style="font-family:var(--mono);font-size:12px">${hhmm(w.a)}–${hhmm(w.b)}</td>
        <td>${w.free.length} guests free</td>
        <td>${d?`<span style="color:var(--${d.sense})">■</span> ${d.sense} · ${d.n} need it`:'<span class="gsub">arc fully covered</span>'}</td>
        <td style="text-align:right"><button class="btn sm" onclick="fitState={senses:${d?`['${d.sense}']`:'[]'},dur:45,cap:null,gender:''};renderFitSlot();render()">Find partner</button></td>
      </tr>`;
    }).join('')}</table>
  </div>`:''}`;
}

/* ---------- guests ---------- */
function whyNoItinerary(g){
  // Guest not in the planning pool — Stage column has an "Add to plan" button
  if(gst(g.id).status!=='invited') return 'not in this plan — use "Add to plan" in the Stage column, or click All Interested Guests';
  // Nothing was even solved for this guest (first run)
  if(!plan.itin[g.id]) return 'not yet solved — click Re-plan in the Day tab toolbar';
  // No flex/capped slots exist yet
  const flex=live().filter(s=>s.sizing!=='all');
  if(!flex.length) return 'no partner slots in the program yet — add a slot on the Day tab';
  // Check each flex slot for why it wasn't assigned
  let allGenderBlocked=true, allFull=true, allConflict=true;
  for(const s of flex){
    if(!genderMatch(g,s)) continue;
    allGenderBlocked=false;
    if(headcount(s)>=capOf(s)) continue;
    allFull=false;
    if(!conflicts(s,itin(g))) {allConflict=false;break;}
  }
  if(allGenderBlocked) return 'every slot has a gender restriction this guest doesn\'t match';
  if(allFull) return 'all matching slots were full when solver reached this guest — Re-plan, raise slot caps, or add more partner slots';
  if(allConflict) return 'all available slots overlap in time with each other for this guest';
  return 'solver didn\'t assign — try Re-plan';
}

function viewGuests(){

/* ---------- shared window scorer ---------- */
function scoreWindows(senses,dur,cap,gender,excludeStart){
  const STEP=15,inv=interested(),results=[];
  for(let a=T0;a<=T1-dur;a+=STEP){
    if(a===excludeStart)continue; // skip the slot's own current time
    const b=a+dur;
    const free=inv.filter(g=>{
      if(gender&&g.p!==gender)return false;
      const it=itin(g);
      if(it.some(x=>a<x.end&&x.start<b))return false;
      const before=it.filter(x=>x.end<=a).sort((x,y)=>y.end-x.end)[0];
      const after=it.filter(x=>x.start>=b).sort((x,y)=>x.start-y.start)[0];
      if(before&&(a-before.end)<leg(before.venue,'__probe__').mins)return false;
      if(after&&(after.start-b)<leg('__probe__',after.venue).mins)return false;
      return true;
    });
    const gainers=senses.length?free.filter(g=>senses.some(x=>g.s.includes(x)&&!coverage(g)[x])):free;
    const depth=senses.length?gainers.reduce((n,g)=>n+senses.filter(x=>g.s.includes(x)&&!coverage(g)[x]).length,0):0;
    const score=gainers.length*2+depth*0.5+(free.length/Math.max(1,inv.length))*free.length*0.3;
    if(free.length>=1)results.push({a,b,free:free.length,gainers:gainers.length,depth,score});
  }
  return results.sort((x,y)=>y.score-x.score);
}

    ${(()=>{

function drawerCostPreview(){

/* ---------- guest CSV import ---------- */
function parseGuestCSV(text){
  // Normalize line endings and split into rows, respecting quoted newlines
  const raw=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  // Split into rows while respecting quoted fields.
  // IMPORTANT: quote characters must be preserved in cur so that parseRow below
  // can still see them and correctly handle commas inside quoted fields.
  const rows=[];let cur='',inQ=false;
  for(let i=0;i<raw.length;i++){
    const c=raw[i];
    if(c==='"'){
      if(inQ&&raw[i+1]==='"'){cur+='""';i++;}  // escaped quote → keep both chars
      else{inQ=!inQ;cur+=c;}                    // open/close quote → keep the char
    } else if(c==='\n'&&!inQ){rows.push(cur);cur='';}
    else cur+=c;
  }
  if(cur.trim())rows.push(cur);
  if(rows.length<2)return[];

  function parseRow(line){
    const cols=[];let cell='',q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(q&&line[i+1]==='"'){cell+='"';i++;}else q=!q;}
      else if(c===','&&!q){cols.push(cell.trim());cell='';}
      else cell+=c;
    }
    cols.push(cell.trim());return cols;
  }

  const headers=parseRow(rows[0]).map(h=>h.toLowerCase().trim());
  const idx=name=>headers.indexOf(name.toLowerCase().trim());
  const get=(row,i)=>i>=0&&i<row.length?row[i].trim():'';

  const iGN =idx('guest number');
  if(iGN<0)return[]; // wrong file format

  const iPA =idx('perspective anchor');
  const iInt=idx('interest');
  const iSE =idx('sense exploration');
  const iPer=idx('perspective');
  // handle typo 'pespective other' and correct spelling
  const iPO =idx('pespective other')>=0?idx('pespective other'):idx('perspective other');
  const iDoA=idx('dietary or accessibility');
  const iAL =idx('accessibility labels'); // header may have trailing space — trimmed above
  const iDN =idx('dietary notes');
  const iDL =idx('dietary labels');
  const iRR =idx('registration readiness');
  const iCon=idx('consent');
  const iCls=idx('classification');
  const iSt =idx('status'); // optional: interested | invited | paid | requested

  const guests=[];
  for(let i=1;i<rows.length;i++){
    if(!rows[i].trim())continue;
    const row=parseRow(rows[i]);
    const gn=get(row,iGN);if(!gn)continue;

    const sRaw=get(row,iSE);
    const sArr=sRaw?sRaw.split(',').map(s=>s.trim()).filter(s=>SENSES.includes(s)):[];

    const dlRaw=get(row,iDL);
    const dlArr=dlRaw?dlRaw.split(',').map(d=>d.trim()).filter(Boolean):[];

    const alRaw=get(row,iAL);
    const alArr=alRaw?alRaw.split(',').map(a=>a.trim()).filter(Boolean):[];

    guests.push({
      id:gn.toLowerCase(),n:gn,
      p:get(row,iPA),
      interest:get(row,iInt),
      // parseDiscs normalises the field: disciplines with internal commas
      // (e.g. "Film, photography, and media") are matched against the known
      // list longest-first so they are never split mid-name.
      s:sArr,f:parseDiscs(get(row,iPer)).join(',')||get(row,iPer),fo:get(row,iPO),
      accessLabels:alArr,
      dietNotes:get(row,iDN),
      dietLabels:dlArr,
      regReady:get(row,iRR),
      consent:get(row,iCon),
      cls:get(row,iCls),
      st:(()=>{
        // Status column takes priority if present and valid
        const VALID_STATUSES=['interested','invited','paid','requested'];
        const raw=get(row,iSt).toLowerCase().trim();
        if(raw&&VALID_STATUSES.includes(raw))return raw;
        // Fall back to Registration Readiness
        return get(row,iRR)==='Yes'?'invited':'requested';
      })(),
      // legacy fields — empty for CSV guests
      d:'',r:alArr.length>0?1:0,e:'',c:'',a:'',
    });
  }
  return guests;
}
function loadGuestCSV(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    const incoming=parseGuestCSV(r.result);
    if(!incoming.length){alert('No guests found. Check that the file has a "Guest Number" header row and matches the schema.');return;}

    // --- Merge mode: keep paths, replace SG placeholders with real guests ---
    // 1. Build the live path map so we know which slots each path uses
    const {labelMap,pathSlots}=livePathMap();

    // 2. For each path, compute the senses it covers (union of all slot senses)
    const pathSenses={};
    Object.entries(pathSlots).forEach(([label,ids])=>{
      const senses=new Set();
      ids.forEach(id=>{const s=slotById(id);if(s)s.senses.forEach(x=>senses.add(x));});
      pathSenses[label]=senses;
    });

    // 3. Score each incoming guest against each path: # senses in common
    function senseFit(g,label){
      const ps=pathSenses[label];if(!ps)return 0;
      return g.s.filter(x=>ps.has(x)).length;
    }

    // 4. Build the list of invited-slot guest IDs (the 25 SG placeholders)
    const invitedIds=invited().map(g=>g.id); // e.g. ['g2','g5',...]
    // Sort by path label so we fill P1 first
    invitedIds.sort((a,b)=>{
      const pa=parseInt((labelMap[a]||'P999').slice(1));
      const pb=parseInt((labelMap[b]||'P999').slice(1));
      return pa-pb;
    });

    // 5. Greedy assignment: for each path slot (invited guest), pick the best-fit
    //    remaining incoming guest by sense overlap, then by Registration Readiness
    const pool=incoming.slice(); // mutable copy
    const assignment={}; // invitedId → incoming guest

    invitedIds.forEach(iid=>{
      const pathLabel=labelMap[iid]||'';
      if(!pool.length)return;
      // Score all remaining pool guests against this path
      const scored=pool.map((g,i)=>({g,i,score:senseFit(g,pathLabel)*10+(g.regReady==='Yes'?5:0)+(g.cls?3:0)}));
      scored.sort((a,b)=>b.score-a.score);
      const best=scored[0];
      assignment[iid]=best.g;
      pool.splice(best.i,1);
    });

    // 6. Apply: replace each invited SG guest with the matched real guest,
    //    preserving the itin slot assignments and path mappings
    const newGuests=GUESTS.map(sg=>{
      const real=assignment[sg.id];
      if(!real)return sg; // no match — keep SG placeholder
      return {
        ...real,
        id:sg.id,  // keep the same internal ID so itin references are unchanged
        // st comes directly from the CSV (Status column, or Registration Readiness fallback)
        e:'',
      };
    });
    // Add remaining pool guests — status already set by parseGuestCSV
    pool.forEach((g,i)=>{
      newGuests.push({...g,id:'csv'+(i+1),e:''});
    });

    const readyN=newGuests.filter(g=>g.st==='invited').length;
    const poolN2=newGuests.filter(g=>g.st==='requested').length;
    if(!confirm(`Merge ${incoming.length} guests from CSV into the current plan?\n\n• ${invitedIds.length} path slots filled with best-fit guests\n• ${readyN} marked Invited (Registration Readiness: Yes)\n• ${poolN2} in pool (not yet ready)\n\nPaths and itineraries are unchanged.`))return;

    GUESTS=newGuests;
    _vmap=null;
    gFilter='all'; // show everything after load so nothing looks missing
    tab='guests';   // switch to Guests tab so you see the result immediately
    render();
    document.getElementById('loadGuestInput').value='';
  };
  r.onerror=()=>alert('Could not read that file.');
  r.readAsText(file);
}

function importPlan(file){

  r.onerror=()=>alert('Could not read that file.');

      ${Object.keys(accessCounts).length?`<div>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Access</div>
        <table class="ledger" style="width:100%">${Object.entries(accessCounts).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<tr><td>${esc(a)}</td><td>${bar(n,focus.length,'#5c6bc0')}</td><td style="font-family:var(--mono);text-align:right">${n}</td></tr>`).join('')}</table>
      </div>`:''}`)}

    ${mSec('slots','Slot confirmation',null,`
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${statCard('Confirmed',confirmed.length,'slots',confirmed.length===allSlots.length?'#1a6b2a':'var(--ink)')}
        ${statCard('Tentative',tentative.length,'slots to confirm',tentative.length>0?'#b85c00':'#1a6b2a')}
        ${statCard('Total slots',allSlots.length,null)}
      </div>`)}

    ${mSec('transit','Transit gaps',`${assumed.length} transit leg${assumed.length===1?'':' s'} in active itineraries without a real measured time.`,`
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:${assumed.length?'16px':'0'}">
        ${statCard('Unmeasured legs',assumed.length,null,assumed.length>0?'#b85c00':'#1a6b2a')}
        ${statCard('Avg transit cost','$'+avgTransit,'per guest',+avgTransit>0?'var(--ink)':'#1a6b2a')}
      </div>
      ${assumed.length?`<table class="ledger" style="width:100%">${assumed.map(l=>`<tr><td><b>${esc(l[0])}</b> <span class="gsub">to</span> <b>${esc(l[1])}</b></td><td style="text-align:right"><span style="font-family:var(--mono);font-size:11px;color:#b85c00">no time set</span></td></tr>`).join('')}</table><div style="margin-top:10px"><button class="btn sm" onclick="tab='transit';render()">Set times in Transit tab</button></div>`:'<div class="gsub">All legs measured. Good to go.</div>'}`)}

    ${mSec('budget','Budget',`Cap is $${BUDGET_CAP} per guest across all stops.`,`
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${statCard('Over budget',overBgt.length,'guests',overBgt.length>0?'#c0392b':'#1a6b2a')}
        ${statCard('Avg stop cost','$'+(focus.length?(focus.reduce((n,g)=>n+totalEventCost(g),0)/focus.length).toFixed(2):0),'per guest')}
      </div>
      ${overBgt.length?`<div style="margin-top:12px;background:#fff0f0;border:1px solid #f0c0c0;border-radius:4px;padding:10px 14px;font-size:12px">${overBgt.map(g=>`<div><b>${esc(g.n)}</b> $${totalEventCost(g).toFixed(2)}</div>`).join('')}</div>`:''}`)}
  </div>`;
}
function render(){fitWindow();renderHead();
  view.innerHTML=tab==='day'?viewDay():tab==='transit'?viewTransit():tab==='risk'?viewRisk():tab==='arcs'?viewArcs():tab==='metrics'?viewMetrics():viewGuests();
  if(tab==='metrics'&&_metricsSection){
    const el=document.getElementById('ms-'+_metricsSection);
    if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),50);
    _metricsSection=null;
  }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.v;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
(async()=>{
  await load();fitWindow();
  const hasplan=plan.slots&&plan.slots.length>0;
  if(!hasplan){
    // No plan loaded — show welcome/load screen
    view.innerHTML=`<div style="max-width:520px;margin:60px auto;text-align:center">
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px">Raison d\'Etre · City Loop Planner</div>
      <h2 style="font-size:24px;margin:0 0 12px">Load a plan to get started</h2>
      <p class="note" style="margin-bottom:28px;font-size:13px">Partner venues and guest data are never stored here. Load your saved plan JSON to begin, then upload your guest CSV when ready.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn solid" style="font-size:14px;padding:10px 24px" onclick="document.getElementById('loadPlanInput').click()">Load plan JSON</button>
        <input type="file" id="loadPlanInput" accept="application/json" style="display:none" onchange="importPlan(this.files[0])">
      </div>
      <p class="note" style="margin-top:20px;font-size:11px">Don\'t have a plan yet? Start from scratch on the <button class="btn sm" onclick="plan=defaultPlan();GUESTS=[];planStage=\'pre-eoi\';save();render()">Pre-EOI blank slate</button></p>
    </div>`;
    renderHead();
  } else if(!Object.keys(plan.itin||{}).length){tionti()}
  else render();
})();
</script>
